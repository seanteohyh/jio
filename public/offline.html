<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Jio</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbf6ef;
        color: #2b2b2b;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        padding: 24px;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        color: #6b665c;
        font-size: 0.9rem;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        background: #c0392b;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 0.7rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #9c4728;
      }
      .mark {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🍜</div>
      <h1>No connection</h1>
      <p>
        Jio needs the network to know what is open, who is voting and how far
        anything is. Reconnect and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
